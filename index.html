<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RGB Mileage Tracker v1.0</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-180.png"><meta name="theme-color" content="#0f4fa8"><style>
:root{--blue:#0f4fa8;--bg:#f7f8fb;--text:#071426;--muted:#667085;--danger:#c62828}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}header{padding:42px 16px 8px;text-align:center}h1{font-size:30px;margin:0}h2{font-size:18px;text-align:center;margin:0;line-height:1.1}.home{max-width:430px;margin:auto;padding:0 18px 28px;display:flex;flex-direction:column;align-items:center}.vehicle-card{text-align:center;margin:14px 0 10px;cursor:pointer}.circle{width:min(70vw,310px);height:min(70vw,310px);border-radius:50%;border:7px solid white;background:linear-gradient(#f7f7f7,#e9e9e9);box-shadow:0 8px 18px #0002;display:flex;align-items:center;justify-content:center;overflow:hidden}.circle img{width:100%;height:100%;object-fit:cover}.circle span{font-size:82px;font-weight:700;color:#555}.vehicle-label{font-size:18px;font-weight:700;margin-top:10px;line-height:1.22}.home-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;margin-top:16px}.home-buttons button{min-height:58px;font-size:12px;padding:6px 4px}.version{color:var(--muted);font-size:12px;margin-top:16px}.top{height:58px;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:10px;border-bottom:1px solid #e5e7eb;background:white;position:sticky;top:0;z-index:2}.top button{background:none;border:0;color:var(--blue);font-weight:600;font-size:16px}section{max-width:680px;margin:12px auto;padding:0 14px}.card,.form{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:14px;box-shadow:0 2px 8px #00000008}.form label{display:block;font-weight:600;font-size:13px;color:#344054;margin:10px 0}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;margin-top:5px;font-size:16px;background:white}.form textarea{min-height:80px}button{border:1px solid #b7c7dd;border-radius:10px;background:white;color:#0b3b79;font-weight:700;padding:10px 12px;margin:4px}.primary{background:var(--blue)!important;color:white!important;border-color:var(--blue)!important;width:100%;padding:13px}.danger{border-color:#f3b2b2;color:var(--danger)}.mpgbox{display:flex;justify-content:space-between;align-items:center;background:#eef5ff;border-radius:10px;padding:14px;margin:12px 0;font-weight:700}.mpgbox strong{font-size:28px}.history-item{display:grid;grid-template-columns:1fr auto;gap:6px;border-top:1px solid #eee;padding:12px 0}.history-item span{grid-column:1/-1;color:#475467;font-size:13px}.info{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #eee;padding:9px 0}.info:first-child{border-top:0}.info span:first-child{color:#475467}.metric{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:12px;text-align:center}.metric span{display:block;color:#475467;font-size:12px}.metric b{font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row{display:flex;justify-content:space-between;align-items:center}.thumb{width:70px;height:70px;border-radius:50%;object-fit:cover}.photo-edit{width:160px;height:160px;border-radius:50%;margin:10px auto;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden;border:5px solid white;box-shadow:0 5px 15px #0002}.photo-edit img{width:100%;height:100%;object-fit:cover}.hidden{display:none}canvas{width:100%;background:#fff;border:1px solid #eee;border-radius:10px;margin:8px 0}details summary{font-weight:800;cursor:pointer;padding:6px}@media (min-width:700px){.circle{width:260px;height:260px}.home-buttons button{font-size:13px}}
</style></head><body><div id="app"></div><script>
const VERSION='1.0';
const DEFAULT_STATIONS=['Murphy USA','Circle K','refuel','BP','Shell'];
const CATEGORIES=['Maintenance','Repair','Oil Change','Brakes','Tires','Cooling System','Electrical','Fuel System','Transmission','Engine','Suspension','Body','Other'];
let db=load(); let currentVehicle=null; let editingFuel=null; let editingMaint=null;
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function load(){let d=localStorage.getItem('rgbMileageData'); if(d){try{return JSON.parse(d)}catch(e){}} return {version:VERSION,vehicles:[null,null],stations:[...DEFAULT_STATIONS]}}
function save(){db.version=VERSION; localStorage.setItem('rgbMileageData',JSON.stringify(db));}
function money(n){n=parseFloat(n||0); return '$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(n,d=2){n=parseFloat(n); return isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):'—'}
function int(n){n=parseFloat(n); return isFinite(n)?Math.round(n).toLocaleString():'—'}
function dateOnly(s){if(!s)return ''; return new Date(s).toISOString().slice(0,10)}
function niceDate(s){if(!s)return '—'; let d=new Date(s); return d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function onlyDate(s){if(!s)return '—'; let d=new Date(s+'T00:00:00'); return d.toLocaleDateString()}
function esc(s){return (s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setScreen(html){document.getElementById('app').innerHTML=html; window.scrollTo(0,0)}
function vehicleName(v){return v?`${v.year||''} ${v.make||''} ${v.model||''}`.trim():'Add Vehicle'}
function autoBadge(v){if(!v)return '+'; if(v.badge)return v.badge.toUpperCase(); let make=(v.make||'').trim(), model=(v.model||'').trim(); if(!make&&!model)return '?'; let mi=make[0]||''; let parts=model.replace(/-/g,'').split(/\s+/).filter(Boolean); if(parts.length===1)return (mi+parts[0]).toUpperCase(); return (mi+parts.map(p=>p[0].match(/\d/)?p:p[0]).join('')).toUpperCase().replace(/[^A-Z0-9]/g,'') }
function splitName(v){let name=vehicleName(v); let words=name.split(' '); if(words.length<=2)return esc(name); return esc(words.slice(0,2).join(' '))+'<br>'+esc(words.slice(2).join(' '))}
function showHome(){
 let cards=db.vehicles.map((v,i)=>`<div class="vehicle-card" onclick="${v?'openVehicle('+i+')':'editVehicle('+i+')'}" oncontextmenu="event.preventDefault();${v?'vehicleMenu('+i+')':''}" ontouchstart="startLong(event,${i})" ontouchend="cancelLong()"><div class="circle ${v&&v.photo?'hasphoto':''}">${v&&v.photo?`<img src="${v.photo}">`:`<span>${v?esc(autoBadge(v)):'+'}</span>`}</div><div class="vehicle-label">${v?splitName(v):'Add Vehicle'}</div></div>`).join('');
 setScreen(`<header><h1>RGB Mileage Tracker</h1></header><main class="home">${cards}<div class="home-buttons"><button onclick="showReports()">▥<br>Reports</button><button onclick="showMaintenance()">🔧<br>Maintenance</button><button onclick="exportData()">⇧<br>Export</button><button onclick="importData()">⇩<br>Import</button><button onclick="showBackup()">☁<br>Backup</button></div><div class="version">Version ${VERSION}</div></main>`)
}
let longTimer=null; function startLong(e,i){cancelLong(); longTimer=setTimeout(()=>{ if(db.vehicles[i]) vehicleMenu(i)},700)} function cancelLong(){if(longTimer)clearTimeout(longTimer)}
function vehicleMenu(i){let v=db.vehicles[i]; if(!v)return; if(confirm(`${vehicleName(v)}\n\nOK = Open Vehicle\nCancel = Manage Vehicle`)){openVehicle(i)}else{let choice=prompt('Type one option: stats, edit, photo, delete','stats'); if(!choice)return; choice=choice.toLowerCase(); if(choice.startsWith('stat'))showStats(i); else if(choice.startsWith('edit'))editVehicle(i); else if(choice.startsWith('photo'))editVehicle(i); else if(choice.startsWith('del'))deleteVehicle(i)}}
function deleteVehicle(i){let v=db.vehicles[i]; if(confirm(`Delete ${vehicleName(v)}?\n\nThis deletes vehicle information, fuel records, maintenance records, and insurance records.`)){db.vehicles[i]=null; save(); showHome()}}
function fileToData(input, cb){let f=input.files[0]; if(!f){cb('');return} let r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(f)}
function editVehicle(i){let v=db.vehicles[i]||{id:uid(),fuel:[],maintenance:[],insuranceAttachments:[],lastFuel:{grade:'90',type:'Non-Ethanol',station:'Murphy USA'}}; currentVehicle=i;
 setScreen(`<div class="top"><button onclick="showHome()">Cancel</button><h2>${db.vehicles[i]?'Edit Vehicle':'Add Vehicle'}</h2><button onclick="saveVehicle(${i})">Save</button></div><section class="card"><label>Vehicle Photo</label><div class="photo-edit">${v.photo?`<img src="${v.photo}">`:`<div>${esc(autoBadge(v))}</div>`}</div><input id="vehPhoto" type="file" accept="image/*"><button onclick="document.getElementById('vehPhoto').value=''; document.getElementById('removePhoto').value='1'">Remove Photo</button><input id="removePhoto" type="hidden" value="0"></section><section class="form"><label>Year<input id="year" value="${esc(v.year)}"></label><label>Make<input id="make" value="${esc(v.make)}"></label><label>Model<input id="model" value="${esc(v.model)}"></label><label>Display Badge (optional)<input id="badge" value="${esc(v.badge)}"></label><label>Purchase Date<input id="purchaseDate" type="date" value="${esc(v.purchaseDate)}"></label><label>Purchase Cost<input id="purchaseCost" type="number" step="0.01" value="${esc(v.purchaseCost)}"></label><h3>Insurance Information</h3><label>Insurance Company<input id="insCompany" value="${esc(v.insCompany)}"></label><label>Policy Number<input id="policyNumber" value="${esc(v.policyNumber)}"></label><label>Effective Date<input id="effectiveDate" type="date" value="${esc(v.effectiveDate)}"></label><label>Expiration Date<input id="expirationDate" type="date" value="${esc(v.expirationDate)}"></label><label>Insurance Value<input id="insuranceValue" type="number" step="0.01" value="${esc(v.insuranceValue)}"></label><label>Insurance Attachments<input id="insAtt" type="file" multiple accept="image/*,.pdf"></label><div>${(v.insuranceAttachments||[]).map((a,idx)=>`<p><a href="${a.data}" download="${esc(a.name)}">${esc(a.name)}</a> <button onclick="removeInsAtt(${i},${idx})">Remove</button></p>`).join('')}</div><button class="primary" onclick="saveVehicle(${i})">Save Vehicle</button></section>`)
}
function saveVehicle(i){let v=db.vehicles[i]||{id:uid(),fuel:[],maintenance:[],insuranceAttachments:[],lastFuel:{grade:'90',type:'Non-Ethanol',station:'Murphy USA'}}; ['year','make','model','badge','purchaseDate','purchaseCost','insCompany','policyNumber','effectiveDate','expirationDate','insuranceValue'].forEach(id=>v[id]=document.getElementById(id).value.trim());
 if(document.getElementById('removePhoto').value==='1')v.photo=''; let photo=document.getElementById('vehPhoto'); let att=document.getElementById('insAtt');
 let finish=()=>{let files=[...att.files]; if(files.length){let count=0; files.forEach(f=>{let r=new FileReader(); r.onload=()=>{v.insuranceAttachments.push({name:f.name,type:f.type,data:r.result}); if(++count===files.length){db.vehicles[i]=v; save();showHome()}}; r.readAsDataURL(f)})} else {db.vehicles[i]=v; save();showHome()}};
 if(photo.files[0]) fileToData(photo,data=>{v.photo=data; finish()}); else finish();
}
function removeInsAtt(i,idx){db.vehicles[i].insuranceAttachments.splice(idx,1);save();editVehicle(i)}
function openVehicle(i){currentVehicle=i; editingFuel=null; let v=db.vehicles[i]; let lf=v.lastFuel||{}; let now=new Date().toISOString(); let prev=latestFuel(v); setScreen(`<div class="top"><button onclick="showHome()">‹</button><h2>${splitName(v)}</h2><button onclick="vehicleMenu(${i})">⋮</button></div><section class="form"><h3>New Entry</h3><label>Date / Time<input id="fuelDate" value="${now}" readonly></label><label>Odometer<input id="odom" type="number" step="0.1" oninput="calcFuel()"></label><label>Miles<input id="miles" type="number" step="0.1" ${prev?'readonly':''} oninput="calcFuel()"></label><label>Gallons Purchased<input id="gallons" type="number" step="0.001" oninput="calcFuel()"></label><label>Fuel Grade<select id="grade">${['87','89','90','91','93','Other'].map(g=>`<option ${lf.grade==g?'selected':''}>${g}</option>`).join('')}</select></label><label>Fuel Type<select id="fuelType">${['Contains Ethanol','Non-Ethanol'].map(t=>`<option ${lf.type==t?'selected':''}>${t}</option>`).join('')}</select></label><label>Station<select id="station" onchange="stationChanged()">${db.stations.map(s=>`<option ${lf.station==s?'selected':''}>${esc(s)}</option>`).join('')}<option>Other</option></select></label><button type="button" onclick="showStations()">Manage Stations</button><div class="mpgbox">MPG <strong id="mpg">—</strong></div><label>Notes<textarea id="notes"></textarea></label><button class="primary" onclick="saveFuel(${i})">Save Entry</button><button onclick="showStats(${i})">▥ Vehicle Statistics</button></section>${fuelHistoryHTML(i,false)}`); calcFuel();}
function latestFuel(v){return [...(v.fuel||[])].sort((a,b)=>new Date(b.date)-new Date(a.date))[0]}
function previousByDate(v,date,id){return (v.fuel||[]).filter(e=>e.id!==id && new Date(e.date)<new Date(date) && e.odometer).sort((a,b)=>new Date(b.date)-new Date(a.date))[0]}
function calcFuel(){let v=db.vehicles[currentVehicle]; let date=document.getElementById('fuelDate')?.value; let od=parseFloat(document.getElementById('odom')?.value); let gallons=parseFloat(document.getElementById('gallons')?.value); let prev=previousByDate(v,date,editingFuel); let mEl=document.getElementById('miles'); if(prev&&isFinite(od)){mEl.value=(od-parseFloat(prev.odometer)).toFixed(1)} let miles=parseFloat(mEl.value); document.getElementById('mpg').textContent=(isFinite(miles)&&isFinite(gallons)&&gallons>0)?(miles/gallons).toFixed(2):'—'}
function stationChanged(){let s=document.getElementById('station'); if(s.value==='Other'){let name=prompt('Enter station name'); if(!name){s.selectedIndex=0;return} let add=confirm('Add this station to future dropdown list?'); if(add&&!db.stations.includes(name)){db.stations.push(name);save()} let opt=new Option(name,name,true,true); s.add(opt,s.options.length-1); s.value=name;}}
function saveFuel(i){let v=db.vehicles[i]; let entry={id:editingFuel||uid(),date:document.getElementById('fuelDate').value,odometer:document.getElementById('odom').value,miles:document.getElementById('miles').value,gallons:document.getElementById('gallons').value,grade:document.getElementById('grade').value,type:document.getElementById('fuelType').value,station:document.getElementById('station').value,mpg:document.getElementById('mpg').textContent,notes:document.getElementById('notes').value}; if(!entry.odometer||!entry.gallons){alert('Odometer and Gallons Purchased are required.');return} let idx=v.fuel.findIndex(e=>e.id===entry.id); if(idx>=0)v.fuel[idx]=entry; else v.fuel.push(entry); v.lastFuel={grade:entry.grade,type:entry.type,station:entry.station}; recalcFuel(v); save(); openVehicle(i)}
function editFuel(i,id){currentVehicle=i; editingFuel=id; let v=db.vehicles[i], e=v.fuel.find(x=>x.id===id); let prev=previousByDate(v,e.date,e.id); setScreen(`<div class="top"><button onclick="openVehicle(${i})">Cancel</button><h2>Edit Entry</h2><button onclick="saveFuel(${i})">Save</button></div><section class="form"><label>Date / Time<input id="fuelDate" value="${esc(e.date)}" readonly></label><label>Odometer<input id="odom" type="number" step="0.1" value="${esc(e.odometer)}" oninput="calcFuel()"></label><label>Miles<input id="miles" type="number" step="0.1" value="${esc(e.miles)}" ${prev?'readonly':''} oninput="calcFuel()"></label><label>Gallons Purchased<input id="gallons" type="number" step="0.001" value="${esc(e.gallons)}" oninput="calcFuel()"></label><label>Fuel Grade<select id="grade">${['87','89','90','91','93','Other'].map(g=>`<option ${e.grade==g?'selected':''}>${g}</option>`).join('')}</select></label><label>Fuel Type<select id="fuelType">${['Contains Ethanol','Non-Ethanol'].map(t=>`<option ${e.type==t?'selected':''}>${t}</option>`).join('')}</select></label><label>Station<select id="station" onchange="stationChanged()">${db.stations.concat([e.station]).filter((x,j,a)=>x&&a.indexOf(x)==j).map(s=>`<option ${e.station==s?'selected':''}>${esc(s)}</option>`).join('')}<option>Other</option></select></label><div class="mpgbox">MPG <strong id="mpg">${esc(e.mpg)}</strong></div><label>Notes<textarea id="notes">${esc(e.notes)}</textarea></label><button class="primary" onclick="saveFuel(${i})">Save Changes</button></section>`);calcFuel()}
function deleteFuel(i,id){if(confirm('Delete fuel entry? Future calculations will be recalculated.')){let v=db.vehicles[i]; v.fuel=v.fuel.filter(e=>e.id!==id); recalcFuel(v); save(); openVehicle(i)}}
function recalcFuel(v){v.fuel.sort((a,b)=>new Date(a.date)-new Date(b.date)); for(let j=0;j<v.fuel.length;j++){let e=v.fuel[j], p=v.fuel[j-1]; if(p&&e.odometer&&p.odometer)e.miles=(parseFloat(e.odometer)-parseFloat(p.odometer)).toFixed(1); let m=parseFloat(e.miles), g=parseFloat(e.gallons); e.mpg=(isFinite(m)&&isFinite(g)&&g>0)?(m/g).toFixed(2):''}}
function fuelHistoryHTML(i,expanded=true){let v=db.vehicles[i]; let rows=[...(v.fuel||[])].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(e=>`<div class="history-item"><b>${niceDate(e.date)}</b><b>${esc(e.mpg)} MPG</b><span>${int(e.odometer)} mi • ${num(e.gallons,3)} gal • ${num(e.miles,1)} mi • ${esc(e.grade)} • ${esc(e.type)} • ${esc(e.station)}</span><span>${esc(e.notes||'')}</span><div><button onclick="editFuel(${i},'${e.id}')">✎ Edit</button><button class="danger" onclick="deleteFuel(${i},'${e.id}')">🗑 Delete</button></div></div>`).join('')||'<p>No fuel entries yet.</p>'; return `<section class="card"><details ${expanded?'open':''}><summary>Fuel History</summary>${rows}</details></section>`}
function showStats(i){let v=db.vehicles[i], st=stats(v.fuel||[]); let maintCost=(v.maintenance||[]).reduce((s,m)=>s+parseFloat(m.cost||0),0); let days=v.purchaseDate?Math.floor((Date.now()-new Date(v.purchaseDate))/(86400000)):0; setScreen(`<div class="top"><button onclick="openVehicle(${i})">‹</button><h2>Vehicle Statistics</h2><button onclick="showHome()">Home</button></div><section class="card row"><div><h3>${splitName(v)}</h3><p>All Time</p></div>${v.photo?`<img class="thumb" src="${v.photo}">`:''}</section><section class="card"><h3>Vehicle Information</h3>${infoRow('Purchase Date',onlyDate(v.purchaseDate))}${infoRow('Days Owned',days?days.toLocaleString():'—')}${infoRow('Years Owned',days?(days/365.25).toFixed(2):'—')}${infoRow('Purchase Cost',money(v.purchaseCost))}${infoRow('Insurance Company',v.insCompany||'—')}${infoRow('Policy Number',v.policyNumber||'—')}${infoRow('Effective Date',onlyDate(v.effectiveDate))}${infoRow('Expiration Date',onlyDate(v.expirationDate))}${infoRow('Insurance Value',money(v.insuranceValue))}</section><section class="card"><h3>Ownership Statistics</h3>${infoRow('Total Maintenance Cost',money(maintCost))}${infoRow('Total Invested',money(parseFloat(v.purchaseCost||0)+maintCost))}${infoRow('Maintenance Cost Per Mile',st.totalMiles?money(maintCost/st.totalMiles):'—')}</section><section class="card"><h3>Fuel Statistics</h3>${infoRow('Total Miles',num(st.totalMiles,1))}${infoRow('Total Gallons Purchased',num(st.totalGallons,3))}${infoRow('Lifetime MPG',num(st.avgMpg,2))}${infoRow('Number of Entries',st.count)}${infoRow('Best MPG',num(st.best,2))}${infoRow('Worst MPG',num(st.worst,2))}${infoRow('Contains Ethanol MPG',num(groupStats(v.fuel,'type','Contains Ethanol').avgMpg,2))}${infoRow('Non-Ethanol MPG',num(groupStats(v.fuel,'type','Non-Ethanol').avgMpg,2))}${infoRow('Contains Ethanol Gallons',num(groupStats(v.fuel,'type','Contains Ethanol').totalGallons,3))}${infoRow('Non-Ethanol Gallons',num(groupStats(v.fuel,'type','Non-Ethanol').totalGallons,3))}</section><section class="card"><h3>Charts</h3><canvas id="chart1" height="140"></canvas><canvas id="chart2" height="140"></canvas><canvas id="chart3" height="140"></canvas></section>`); drawLine('chart1',v.fuel.map(e=>parseFloat(e.mpg)),'MPG Over Time'); drawLine('chart2',v.fuel.map(e=>parseFloat(e.miles)),'Miles Driven Over Time'); drawLine('chart3',v.fuel.map(e=>parseFloat(e.gallons)),'Gallons Purchased Over Time');}
function infoRow(a,b){return `<div class="info"><span>${esc(a)}</span><b>${esc(b)}</b></div>`}
function stats(entries){entries=(entries||[]).filter(e=>parseFloat(e.gallons)>0); let totalGallons=entries.reduce((s,e)=>s+parseFloat(e.gallons||0),0); let totalMiles=entries.reduce((s,e)=>s+parseFloat(e.miles||0),0); let mpgs=entries.map(e=>parseFloat(e.mpg)).filter(isFinite); return {totalGallons,totalMiles,avgMpg:totalGallons?totalMiles/totalGallons:NaN,count:entries.length,best:mpgs.length?Math.max(...mpgs):NaN,worst:mpgs.length?Math.min(...mpgs):NaN}}
function groupStats(entries,key,val){return stats((entries||[]).filter(e=>e[key]===val))}
function showReports(){let opts='<option value="all">All Vehicles</option>'+db.vehicles.map((v,i)=>v?`<option value="${i}">${esc(vehicleName(v))}</option>`:'').join(''); setScreen(`<div class="top"><button onclick="showHome()">‹</button><h2>Reports</h2><span></span></div><section class="form"><label>Vehicle<select id="reportVehicle" onchange="runReport()">${opts}</select></label><label>Time Frame<select id="reportRange" onchange="customRangeToggle();runReport()"><option>All Time</option><option>YTD</option><option>Previous Week</option><option>Previous Month</option><option>Previous Year</option><option>Manual Range</option></select></label><div id="customDates" class="hidden"><label>Start Date<input id="startDate" type="date" onchange="runReport()"></label><label>End Date<input id="endDate" type="date" onchange="runReport()"></label></div></section><section id="reportOut"></section>`); runReport()}
function customRangeToggle(){document.getElementById('customDates').classList.toggle('hidden',document.getElementById('reportRange').value!=='Manual Range')}
function rangeDates(){let r=document.getElementById('reportRange').value, now=new Date(), start=null,end=new Date(); if(r==='YTD')start=new Date(now.getFullYear(),0,1); if(r==='Previous Week'){let day=now.getDay(); end=new Date(now); end.setDate(now.getDate()-day); start=new Date(end); start.setDate(end.getDate()-7)} if(r==='Previous Month'){start=new Date(now.getFullYear(),now.getMonth()-1,1); end=new Date(now.getFullYear(),now.getMonth(),1)} if(r==='Previous Year'){start=new Date(now.getFullYear()-1,0,1); end=new Date(now.getFullYear(),0,1)} if(r==='Manual Range'){start=new Date(document.getElementById('startDate').value||'1900-01-01'); end=new Date(document.getElementById('endDate').value||'2999-01-01'); end.setDate(end.getDate()+1)} return {start,end}}
function filteredFuel(){let sel=document.getElementById('reportVehicle').value; let entries=[]; db.vehicles.forEach((v,i)=>{if(v&&(sel==='all'||sel==i))entries.push(...(v.fuel||[]).map(e=>({...e,vehicle:vehicleName(v)})))}); let {start,end}=rangeDates(); return entries.filter(e=>(!start||new Date(e.date)>=start)&&(!end||new Date(e.date)<end))}
function runReport(){let e=filteredFuel(), st=stats(e); let byType=['Contains Ethanol','Non-Ethanol'].map(t=>[t,groupStats(e,'type',t)]); let byGrade=['87','89','90','91','93','Other'].map(g=>[g,groupStats(e,'grade',g)]).filter(x=>x[1].count); document.getElementById('reportOut').innerHTML=`<section class="grid">${metric('Total Miles',num(st.totalMiles,1))}${metric('Total Gallons',num(st.totalGallons,3))}${metric('Average MPG',num(st.avgMpg,2))}${metric('Fill-Ups',st.count)}${metric('Best MPG',num(st.best,2))}${metric('Worst MPG',num(st.worst,2))}</section><section class="card"><h3>Fuel Type Comparison</h3>${byType.map(([k,s])=>infoRow(k,`${num(s.avgMpg,2)} MPG • ${num(s.totalGallons,3)} gal • ${num(s.totalMiles,1)} mi`)).join('')}</section><section class="card"><h3>Fuel Grade Comparison</h3>${byGrade.map(([k,s])=>infoRow(k,`${num(s.avgMpg,2)} MPG • ${num(s.totalGallons,3)} gal • ${num(s.totalMiles,1)} mi`)).join('')||'<p>No data.</p>'}</section><section class="card"><h3>Charts</h3><canvas id="rchart1" height="120"></canvas><canvas id="rchart2" height="120"></canvas><canvas id="rchart3" height="120"></canvas></section>`; drawLine('rchart1',e.map(x=>parseFloat(x.mpg)),'MPG Over Time'); drawLine('rchart2',e.map(x=>parseFloat(x.miles)),'Miles Over Time'); drawLine('rchart3',e.map(x=>parseFloat(x.gallons)),'Gallons Over Time');}
function metric(a,b){return `<div class="metric"><span>${a}</span><b>${b}</b></div>`}
function drawLine(id,vals,title){let c=document.getElementById(id); if(!c)return; let ctx=c.getContext('2d'), w=c.width=c.clientWidth, h=c.height; ctx.clearRect(0,0,w,h); ctx.fillStyle='#111';ctx.font='14px sans-serif';ctx.fillText(title,8,18); vals=vals.filter(isFinite); if(vals.length<2){ctx.fillText('Not enough data',8,55);return} let min=Math.min(...vals), max=Math.max(...vals); if(min===max){min-=1;max+=1} ctx.strokeStyle='#0f4fa8';ctx.lineWidth=2;ctx.beginPath(); vals.forEach((v,i)=>{let x=10+i*(w-20)/(vals.length-1); let y=30+(max-v)*(h-45)/(max-min); if(i)ctx.lineTo(x,y); else ctx.moveTo(x,y)}); ctx.stroke();}
function showMaintenance(){let opts=db.vehicles.map((v,i)=>v?`<option value="${i}">${esc(vehicleName(v))}</option>`:'').join(''); if(!opts){alert('Add a vehicle first.');showHome();return} setScreen(`<div class="top"><button onclick="showHome()">‹</button><h2>Maintenance</h2><span></span></div><section class="form"><label>Vehicle<select id="maintVehicle" onchange="renderMaint()">${opts}</select></label><button class="primary" onclick="editMaint()">Add Maintenance Record</button></section><section id="maintList"></section>`); renderMaint()}
function renderMaint(){let i=document.getElementById('maintVehicle').value, v=db.vehicles[i]; let rows=(v.maintenance||[]).sort((a,b)=>new Date(b.dropoff)-new Date(a.dropoff)).map(m=>`<div class="history-item"><b>${onlyDate(m.dropoff)} - ${onlyDate(m.pickup)}</b><b>${esc(m.category)}</b><span>${esc(m.location)} • ${int(m.odometer)} mi • ${money(m.cost)}</span><span>${esc(m.notes||'')}</span><div><button onclick="editMaint('${m.id}')">✎ Edit</button><button class="danger" onclick="deleteMaint('${m.id}')">🗑 Delete</button></div></div>`).join('')||'<p>No maintenance records.</p>'; document.getElementById('maintList').innerHTML=`<section class="card"><h3>Maintenance History</h3>${rows}</section>`}
function editMaint(id=null){let i=document.getElementById('maintVehicle')?.value ?? currentVehicle ?? db.vehicles.findIndex(Boolean); currentVehicle=parseInt(i); let v=db.vehicles[currentVehicle]; let m=id?(v.maintenance||[]).find(x=>x.id===id):{id:uid(),attachments:[]}; editingMaint=id; setScreen(`<div class="top"><button onclick="showMaintenance()">Cancel</button><h2>${id?'Edit':'Add'} Maintenance</h2><button onclick="saveMaint()">Save</button></div><section class="form"><label>Vehicle<input value="${esc(vehicleName(v))}" readonly></label><label>Drop Off Date<input id="dropoff" type="date" value="${esc(m.dropoff)}"></label><label>Pick Up Date<input id="pickup" type="date" value="${esc(m.pickup)}"></label><label>Location<input id="mlocation" value="${esc(m.location)}"></label><label>Category<select id="mcategory">${CATEGORIES.map(c=>`<option ${m.category==c?'selected':''}>${c}</option>`).join('')}</select></label><label>Odometer<input id="modom" type="number" value="${esc(m.odometer)}"></label><label>Cost<input id="mcost" type="number" step="0.01" value="${esc(m.cost)}"></label><label>Notes<textarea id="mnotes">${esc(m.notes)}</textarea></label><label>Photos / Receipts<input id="matt" type="file" multiple accept="image/*,.pdf"></label><div>${(m.attachments||[]).map(a=>`<p><a href="${a.data}" download="${esc(a.name)}">${esc(a.name)}</a></p>`).join('')}</div><button class="primary" onclick="saveMaint()">Save Record</button></section>`)}
function saveMaint(){let v=db.vehicles[currentVehicle]; let m=editingMaint?(v.maintenance||[]).find(x=>x.id===editingMaint):{id:uid(),attachments:[]}; m.dropoff=document.getElementById('dropoff').value; m.pickup=document.getElementById('pickup').value; m.location=document.getElementById('mlocation').value; m.category=document.getElementById('mcategory').value; m.odometer=document.getElementById('modom').value; m.cost=document.getElementById('mcost').value; m.notes=document.getElementById('mnotes').value; let files=[...document.getElementById('matt').files]; let finish=()=>{if(!editingMaint)v.maintenance.push(m); save(); showMaintenance()}; if(files.length){let count=0; files.forEach(f=>{let r=new FileReader(); r.onload=()=>{m.attachments.push({name:f.name,type:f.type,data:r.result}); if(++count===files.length)finish()}; r.readAsDataURL(f)})} else finish()}
function deleteMaint(id){let i=document.getElementById('maintVehicle').value, v=db.vehicles[i]; if(confirm('Delete maintenance record?')){v.maintenance=v.maintenance.filter(m=>m.id!==id);save();renderMaint()}}
function showStations(){setScreen(`<div class="top"><button onclick="openVehicle(${currentVehicle})">‹</button><h2>Manage Stations</h2><button onclick="addStation()">Add</button></div><section class="card">${db.stations.map((s,i)=>`<div class="info"><span>${esc(s)}</span><span><button onclick="editStation(${i})">Edit</button><button class="danger" onclick="deleteStation(${i})">Delete</button></span></div>`).join('')}</section>`)}
function addStation(){let n=prompt('New station name'); if(n&&!db.stations.includes(n)){db.stations.push(n);save();showStations()}}
function editStation(i){let old=db.stations[i]; let n=prompt('Edit station name',old); if(n&&n!==old&&confirm('This will update all historical entries using this station name.')){db.stations[i]=n; db.vehicles.forEach(v=>v&&(v.fuel||[]).forEach(e=>{if(e.station===old)e.station=n}));save();showStations()}}
function deleteStation(i){let s=db.stations[i]; if(confirm('Remove station from dropdown? Historical entries will remain unchanged.')){db.stations.splice(i,1);save();showStations()}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='RGB_Mileage_Tracker_Backup_v'+VERSION+'.json'; a.click()}
function importData(){let inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json'; inp.onchange=()=>{let r=new FileReader(); r.onload=()=>{try{let nd=JSON.parse(r.result); if(confirm('Import data and replace current app data?')){db=nd;save();showHome()}}catch(e){alert('Invalid import file.')}}; r.readAsText(inp.files[0])}; inp.click()}
function showBackup(){setScreen(`<div class="top"><button onclick="showHome()">‹</button><h2>Backup / Restore</h2><span></span></div><section class="card"><h3>Backup</h3><p>Create a full JSON backup that can be saved to iCloud Files or shared.</p><button class="primary" onclick="exportData();localStorage.setItem('rgbLastBackup',new Date().toISOString());showBackup()">Create Backup</button></section><section class="card"><h3>Restore</h3><p>Restore from a previous JSON backup.</p><button onclick="importData()">Restore Backup</button></section><section class="card"><p>Last Backup: ${niceDate(localStorage.getItem('rgbLastBackup'))}</p></section>`)}
window.addEventListener('beforeunload',e=>{}); if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js'); showHome();
</script></body></html>
