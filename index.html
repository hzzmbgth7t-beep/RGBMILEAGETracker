<style>
:root{--bg:#f6f3ed;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#d9dee8;--blue:#2563eb;--red:#dc2626;--green:#059669;--gold:#b7791f;--shadow:0 8px 28px rgba(17,24,39,.10);--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#fbfaf7,#f2eee7);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:14px;background:#e8eefc;color:#173b85;padding:12px 14px;font-weight:800}button.primary{background:var(--blue);color:#fff}button.danger{background:#fee2e2;color:#991b1b}button.ghost{background:#eef2f7;color:#334155}button.small{font-size:13px;padding:8px 10px}.wrap{max-width:520px;margin:0 auto;padding:16px 16px 34px;min-height:100vh}.title{font-size:30px;font-weight:900;letter-spacing:-.04em;text-align:center;margin:8px 0 12px}.subtitle{text-align:center;color:var(--muted);font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.top b{font-size:18px}.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}.stack{display:flex;flex-direction:column;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.vehicle-card{text-align:center;padding:4px 0 8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.circle{width:min(58vw,272px);height:min(58vw,272px);border-radius:50%;margin:0 auto 8px;background:#eef2ff;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:#1e3a8a;overflow:hidden;box-shadow:0 8px 22px rgba(17,24,39,.15);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}.circle img{width:100%;height:100%;object-fit:cover;transform-origin:center center;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.vehicle-name{font-weight:850;font-size:19px;line-height:1.16;min-height:44px}.home-actions{display:grid;gap:8px;margin-top:10px}.footer-version{text-align:center;color:#94a3b8;margin-top:18px;font-size:12px}.muted{color:var(--muted)}.note{font-size:12px;color:var(--muted);margin-top:5px}label{display:block;font-weight:800;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:86px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hr{height:1px;background:var(--line);margin:14px 0}.list-item{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;margin:10px 0}.list-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hidden{display:none!important}.badge{display:inline-block;background:#e0f2fe;color:#075985;border-radius:8px;padding:2px 6px;font-weight:800;font-size:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;text-align:center;box-shadow:var(--shadow)}.kpi b{display:block;font-size:23px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:end;justify-content:center;z-index:1000}.modal.show{display:flex}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.locbox{background:#f8fafc;border:1px solid #dbe3ef;border-radius:12px;padding:10px;color:#334155}.table{width:100%;border-collapse:collapse;font-size:14px}.table td,.table th{border-bottom:1px solid var(--line);padding:8px;text-align:left}.crop-stage{width:min(78vw,340px);height:min(78vw,340px);margin:10px auto;background:#111;border-radius:18px;position:relative;overflow:hidden;touch-action:none}.crop-mask{position:absolute;inset:8px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 999px rgba(0,0,0,.35);z-index:2;pointer-events:none}.crop-img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center center;user-select:none;pointer-events:none}.preview{width:150px;height:150px;border-radius:50%;overflow:hidden;background:#eef2ff;margin:8px auto;position:relative;border:2px solid #cbd5e1}.preview img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center}.import-preview{overflow:auto;max-height:320px}.warning{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px}.ok{background:#ecfdf5;border:1px solid #bbf7d0;color:#065f46;border-radius:12px;padding:10px}canvas{width:100%;height:170px;background:#fff;border:1px solid var(--line);border-radius:14px}.footer-space{height:18px}
</style>

<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const VERSION='2.0.7';
const BUILD_DATE='2026-06-03';
const KEY='rgbm_data_v110';
const DEFAULT_STATIONS=['Murphy USA','Circle K','refuel','BP','Shell'];
const FUEL_GRADES=['','87','89','90','91','93','Other'];
const FUEL_TYPES=[['No','Ethanol'],['Yes','Ethanol Free']];
const ENTRY_TYPES=['Fuel','Maintenance','Historical Marker'];
const DATA_QUALITIES=['Verified','Review','Estimated','Historical'];
const MAINT_CATS=['Maintenance','Repair','Oil Change','Brakes','Tires','Cooling System','Electrical','Fuel System','Transmission','Engine','Suspension','Body','Other'];
let state=load(), route={screen:'home'}, lpTimer=null, cropCtx=null;
function defaultState(){return{version:VERSION,vehicles:[null,null],stations:[...DEFAULT_STATIONS],lastBackup:null,nextSequence:1}}
function load(){try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return defaultState()}}
function save(){state.version=VERSION;localStorage.setItem(KEY,JSON.stringify(state))}
function $(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function money(n){return isFinite(+n)&&n!==''?'$'+(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):''}
function num(n,d=2){return isFinite(+n)?(+n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d}):''}
function dateTime(s){return s?new Date(s).toLocaleString():''}
function dateOnly(s){return s?new Date(s).toLocaleDateString():''}
function versionFooter(){return `<div class="footer-version">Version ${VERSION}</div>`}
function vehicleName(v){return [v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle'}
function badgeFor(v){if(v.badge)return v.badge.toUpperCase();let make=(v.make||'').trim(), model=(v.model||'').trim();let combo=(make+' '+model).replace(/-/g,' ');if(/grand\s+wagoneer/i.test(combo))return 'JGW';if(/c\s*10/i.test(combo))return 'CC10';if(/f\s*150.*lightning/i.test(combo))return 'F150L';if(/cj\s*7/i.test(combo))return 'CJ7';let parts=combo.split(/\s+/).filter(Boolean);let out='';for(let p of parts){if(/\d/.test(p))out+=p.replace(/[^a-zA-Z0-9]/g,'');else out+=p[0]||''}return (out||'+').toUpperCase().slice(0,6)}
function imgTransform(v){let c=v.crop||{z:1,x:0,y:0};return `transform:translate(calc(-50% + ${c.x||0}px),calc(-50% + ${c.y||0}px)) scale(${c.z||1});width:100%;height:100%;object-fit:cover;`}
function vehicleCircle(v){if(!v)return'<div class="circle">+</div><div class="vehicle-name">Add Vehicle</div>';if(v.photo)return`<div class="circle"><img src="${v.photo}" style="${imgTransform(v)}" draggable="false"></div><div class="vehicle-name">${esc(v.year)} ${esc(v.make)}<br>${esc(v.model)}</div>`;return`<div class="circle">${esc(badgeFor(v))}</div><div class="vehicle-name">${esc(v.year)} ${esc(v.make)}<br>${esc(v.model)}</div>`}
function render(){let app=$('app'); if(route.screen==='home')return home(app); if(route.screen==='vehicle')return vehicleScreen(app,route.i); if(route.screen==='profile')return profileScreen(app,route.i); if(route.screen==='crop')return cropScreen(app,route.i); if(route.screen==='stats')return statsScreen(app,route.i); if(route.screen==='maintenance')return maintenanceScreen(app,route.i); if(route.screen==='reports')return reportsScreen(app); if(route.screen==='settings')return settingsScreen(app); if(route.screen==='stations')return stationsScreen(app); if(route.screen==='import')return importScreen(app); if(route.screen==='backup')return backupScreen(app)}
function nav(screen,extra={}){route={screen,...extra};render();setTimeout(()=>scrollTo(0,0),0)}
function home(app){app.innerHTML=`<div class="title">RGB Mileage</div><div class="subtitle">Tap a vehicle circle to enter records.</div><div class="stack">
${[0,1].map(i=>`<div class="vehicle-card" oncontextmenu="event.preventDefault();return false" ontouchstart="lpStart(event,${i})" ontouchend="lpEnd()" onmousedown="mouseLP(event,${i})" onmouseup="lpEnd()" onclick="tapVehicle(${i})">${vehicleCircle(state.vehicles[i])}</div>`).join('')}
</div><div class="home-actions"><button onclick="nav('reports')">Reports</button><button onclick="nav('maintenance')">Maintenance</button><button onclick="nav('import')">Import CSV / XLSX</button><button onclick="exportData(false)">Export Data</button><button onclick="nav('backup')">Backup / Restore</button><button onclick="nav('settings')" class="ghost">Settings</button></div>${versionFooter()}`}
function tapVehicle(i){state.vehicles[i]?nav('vehicle',{i}):nav('profile',{i})}
function lpStart(e,i){clearTimeout(lpTimer);lpTimer=setTimeout(()=>{e.preventDefault();longVehicle(i)},650)}
function mouseLP(e,i){if(e.button!==0)return;clearTimeout(lpTimer);lpTimer=setTimeout(()=>longVehicle(i),650)}
function lpEnd(){clearTimeout(lpTimer)}
function longVehicle(i){if(!state.vehicles[i])return;nav('profile',{i})}
function top(title,back='home'){return `<div class="top"><button class="small" onclick="${back==='home'?'nav(\\'home\\')':'historyBack()'}">Back</button><b>${esc(title)}</b><span></span></div>`}
function historyBack(){nav('home')}
function profileScreen(app,i){let v=state.vehicles[i]||{id:uid(),fuel:[],maintenance:[],insurance:{attachments:[]},lastFuel:{},crop:{z:1,x:0,y:0}};app.innerHTML=`${top(state.vehicles[i]?'Edit Vehicle':'Add Vehicle')}<div class="card"><h3>Vehicle Information</h3>
<div class="preview">${v.photo?`<img src="${v.photo}" style="${imgTransform(v)}">`:`<b>${esc(badgeFor(v))}</b>`}</div>
<div class="actions"><button onclick="$('photoIn').click()">Choose Photo</button>${v.photo?`<button onclick="nav('crop',{i:${i}})">Crop / Frame Photo</button><button onclick="resetCrop(${i})">Reset Photo Crop</button>`:''}<input id="photoIn" class="hidden" type="file" accept="image/*" onchange="loadVehiclePhoto(${i},this.files[0])"></div>
<label>Year</label><input id="year" value="${esc(v.year||'')}">
<label>Make</label><input id="make" value="${esc(v.make||'')}">
<label>Model</label><input id="model" value="${esc(v.model||'')}">
<label>Display Badge</label><input id="badge" value="${esc(v.badge||'')}">
<div class="row"><div><label>Vehicle Acquisition Date</label><input id="acqDate" type="date" value="${esc(v.acquisitionDate||v.purchaseDate||'')}"></div><div><label>Starting Odometer</label><input id="startOdo" type="number" step="0.01" value="${esc(v.startingOdometer||'')}"></div></div>
<div class="row"><div><label>Purchase Cost</label><input id="purchaseCost" type="number" step="0.01" value="${esc(v.purchaseCost||'')}"></div><div><label>Insurance Value</label><input id="insValue" type="number" step="0.01" value="${esc(v.insurance?.value||'')}"></div></div>
</div><div class="card"><h3>Insurance Information</h3>
<label>Company</label><input id="insCompany" value="${esc(v.insurance?.company||'')}">
<label>Policy Number</label><input id="insPolicy" value="${esc(v.insurance?.policy||'')}">
<div class="row"><div><label>Effective Date</label><input id="insEff" type="date" value="${esc(v.insurance?.effective||'')}"></div><div><label>Expiration Date</label><input id="insExp" type="date" value="${esc(v.insurance?.expiration||'')}"></div></div>
<label>Attachments</label><input id="insAtt" type="file" multiple accept=".pdf,image/*" onchange="addAttachments(${i},this.files,'insurance')">
${(v.insurance?.attachments||[]).map((a,idx)=>`<div class="list-item"><b>${esc(a.name)}</b><div class="actions"><button class="small" onclick="viewAttachment(${i},${idx})">View</button><button class="small danger" onclick="delAttachment(${i},${idx})">Delete</button></div></div>`).join('')}
</div><div class="actions"><button class="primary" onclick="saveProfile(${i})">Save Vehicle</button>${state.vehicles[i]?`<button class="danger" onclick="deleteVehicle(${i})">Delete Vehicle</button>`:''}</div>${versionFooter()}`;window._profilePhoto=v.photo||''}
function fileToDataURL(file,cb){let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function loadVehiclePhoto(i,file){if(!file)return;fileToDataURL(file,d=>{window._profilePhoto=d;saveProfile(i,true)})}
function saveProfile(i,goCrop=false){let old=state.vehicles[i]||{id:uid(),fuel:[],maintenance:[],insurance:{attachments:[]},lastFuel:{},crop:{z:1,x:0,y:0}};old.year=$('year')?.value.trim()||old.year||'';old.make=$('make')?.value.trim()||old.make||'';old.model=$('model')?.value.trim()||old.model||'';old.badge=$('badge')?.value.trim()||old.badge||'';old.photo=window._profilePhoto||old.photo||'';old.acquisitionDate=$('acqDate')?.value||old.acquisitionDate||'';old.startingOdometer=$('startOdo')?.value||old.startingOdometer||'';old.purchaseCost=$('purchaseCost')?.value||old.purchaseCost||'';old.insurance=old.insurance||{attachments:[]};old.insurance.company=$('insCompany')?.value.trim()||old.insurance.company||'';old.insurance.policy=$('insPolicy')?.value.trim()||old.insurance.policy||'';old.insurance.effective=$('insEff')?.value||old.insurance.effective||'';old.insurance.expiration=$('insExp')?.value||old.insurance.expiration||'';old.insurance.value=$('insValue')?.value||old.insurance.value||'';old.crop=old.crop||{z:1,x:0,y:0};state.vehicles[i]=old;save();goCrop?nav('crop',{i}):nav('vehicle',{i})}
function deleteVehicle(i){if(confirm('Delete Vehicle? This deletes vehicle information, fuel records, maintenance records, insurance records, and attachments.')){state.vehicles[i]=null;save();nav('home')}}
function resetCrop(i){let v=state.vehicles[i];v.crop={z:1,x:0,y:0};save();render()}
function cropScreen(app,i){let v=state.vehicles[i];if(!v||!v.photo)return nav('profile',{i});let c=v.crop||{z:1,x:0,y:0};app.innerHTML=`${top('Crop Vehicle Photo')}<div class="card"><p class="muted">Drag the photo under the fixed circle. Use the slider to zoom out or in.</p><div class="crop-stage" id="cropStage"><img id="cropImg" class="crop-img" src="${v.photo}"><div class="crop-mask"></div></div>
<label>Zoom</label><input id="zoom" type="range" min="0.35" max="2.4" step="0.01" value="${c.z||1}" oninput="updateCrop()">
<div class="preview"><img id="prevImg" src="${v.photo}"></div>
<div class="actions"><button class="primary" onclick="saveCrop(${i})">Save Crop</button><button onclick="resetCropLive()">Reset Photo Crop</button><button class="ghost" onclick="nav('profile',{i:${i}})">Cancel</button></div></div>${versionFooter()}`;
cropCtx={i,x:c.x||0,y:c.y||0,z:c.z||1,drag:false,sx:0,sy:0};setTimeout(initCrop,50)}
function initCrop(){let st=$('cropStage');st.addEventListener('pointerdown',e=>{cropCtx.drag=true;cropCtx.sx=e.clientX;cropCtx.sy=e.clientY;st.setPointerCapture(e.pointerId)});st.addEventListener('pointermove',e=>{if(!cropCtx.drag)return;cropCtx.x+=e.clientX-cropCtx.sx;cropCtx.y+=e.clientY-cropCtx.sy;cropCtx.sx=e.clientX;cropCtx.sy=e.clientY;updateCrop()});st.addEventListener('pointerup',()=>cropCtx.drag=false);updateCrop()}
function updateCrop(){if(!cropCtx)return;cropCtx.z=+$('zoom').value;let t=`translate(calc(-50% + ${cropCtx.x}px),calc(-50% + ${cropCtx.y}px)) scale(${cropCtx.z})`;['cropImg','prevImg'].forEach(id=>{$(id).style.transform=t;$(id).style.width='100%';$(id).style.height='100%';$(id).style.objectFit='cover'})}
function resetCropLive(){cropCtx.x=0;cropCtx.y=0;$('zoom').value=1;updateCrop()}
function saveCrop(i){state.vehicles[i].crop={x:Math.round(cropCtx.x),y:Math.round(cropCtx.y),z:+cropCtx.z.toFixed(2)};save();nav('profile',{i})}
function vehicleScreen(app,i){let v=state.vehicles[i];if(!v)return nav('home');recalcFuel(v);let lf=v.lastFuel||{};app.innerHTML=`${top(vehicleName(v))}<div class="actions"><button onclick="nav('profile',{i:${i}})">Edit Vehicle</button><button onclick="nav('stats',{i:${i}})">Vehicle Statistics</button></div>
<div class="card"><h3>New Entry</h3><label>Entry Type</label><select id="etype" onchange="entryTypeChange()">${ENTRY_TYPES.map(x=>`<option>${x}</option>`).join('')}</select><label>Data Quality</label><select id="quality">${DATA_QUALITIES.map(x=>`<option ${x==='Verified'?'selected':''}>${x}</option>`).join('')}</select><label>Date / Time</label><input id="dt" type="datetime-local" value="${new Date().toISOString().slice(0,16)}">
<label>Odometer</label><input id="odo" type="number" step="0.01" oninput="calcEntry(${i})">
<label>Miles</label><input id="miles" type="number" step="0.01" oninput="calcEntry(${i})">
<div id="fuelFields"><label>Gallons Purchased</label><input id="gallons" type="number" step="0.001" oninput="calcEntry(${i})">
<div class="row"><div><label>Fuel Grade</label><select id="grade">${FUEL_GRADES.map(g=>`<option ${lf.grade===g?'selected':''}>${g||'Blank'}</option>`).join('')}</select></div><div><label>Ethanol Free</label><select id="ethanolFree">${FUEL_TYPES.map(([val,label])=>`<option value="${val}" ${lf.ethanolFree===val?'selected':''}>${label}</option>`).join('')}</select></div></div>
<label>Station</label><select id="station" onchange="if(this.value==='Other')otherStation()">${state.stations.map(s=>`<option ${lf.station===s?'selected':''}>${esc(s)}</option>`).join('')}<option>Other</option></select>
<label>Location</label><div class="locbox" id="locText">No location selected.</div><input id="locAddress" type="hidden"><input id="locLat" type="hidden"><input id="locLon" type="hidden"><div class="actions"><button onclick="useLocation()">Use Current Location</button><button class="ghost" onclick="clearLocation()">Clear Location</button></div><div class="note">Location is only captured when this button is tapped.</div>
<div class="row"><div><label>Fuel Price Per Gallon</label><input id="ppg" type="number" step="0.01" oninput="calcEntry(${i})"></div><div><label>Total Fuel Cost</label><input id="fuelCost" type="number" step="0.01" oninput="manualFuelCost(${i})"></div></div><label>Fuel Cost Source</label><select id="costSource"><option>Calculated</option><option>Entered Manually</option></select><label>MPG</label><input id="mpg" readonly></div>
<label>Notes</label><textarea id="notes"></textarea><button class="primary" onclick="saveEntry(${i})">Save Entry</button></div>
<div class="card"><h3>History</h3><button class="ghost" onclick="$('hist').classList.toggle('hidden')">Show / Hide History</button><div id="hist" class="hidden">${historyList(v,i)}</div></div>${versionFooter()}`;calcEntry(i)}
function entryTypeChange(){let type=$('etype').value;$('fuelFields').classList.toggle('hidden',type!=='Fuel')}
function previousOdo(v){let f=(v.fuel||[]).filter(e=>e.entryType!=='Historical Marker').slice().sort(sortEntries);return f.length?+f[f.length-1].odometer:null}
function calcEntry(i){let v=state.vehicles[i], odo=+$('odo').value, prev=previousOdo(v);if(prev!==null&&isFinite(odo)&&odo>0){$('miles').value=(odo-prev).toFixed(2)}let miles=+$('miles').value, gal=+$('gallons')?.value||0, ppg=+$('ppg')?.value||0;if(gal&&ppg&&$('costSource')?.value!=='Entered Manually')$('fuelCost').value=(gal*ppg).toFixed(2);$('mpg').value=(miles>0&&gal>0)?(miles/gal).toFixed(2):''}
function manualFuelCost(i){if($('fuelCost').value)$('costSource').value='Entered Manually';let gal=+$('gallons').value,cost=+$('fuelCost').value;if(gal&&cost&&(!$('ppg').value||$('costSource').value==='Entered Manually'))$('ppg').value=(cost/gal).toFixed(2)}
function otherStation(){sheet(`<h2>New Station</h2><label>Station Name</label><input id="newStation"><p>Add this station to future dropdown list?</p><div class="actions"><button class="primary" onclick="setOtherStation(true)">Yes</button><button onclick="setOtherStation(false)">No</button><button class="ghost" onclick="closeSheet()">Cancel</button></div>`)}
function setOtherStation(add){let n=$('newStation').value.trim();if(!n)return;if(add&&!state.stations.includes(n)){state.stations.push(n);save()}let sel=$('station');if(![...sel.options].some(o=>o.value===n)){let opt=document.createElement('option');opt.textContent=n;sel.insertBefore(opt,sel.lastElementChild)}sel.value=n;closeSheet()}
function clearLocation(){$('locAddress').value='';$('locLat').value='';$('locLon').value='';$('locText').textContent='No location selected.'}

function parseImport(file){if(!file)return;let ext=file.name.split('.').pop().toLowerCase();$('impStatus').innerHTML='<p>Reading file...</p>';if(ext==='csv'){let r=new FileReader();r.onload=()=>processRows(csvToRows(r.result));r.readAsText(file)}else{let r=new FileReader();r.onload=()=>{if(typeof XLSX==='undefined'){ $('impStatus').innerHTML='<div class="warning">XLSX support requires the included SheetJS library to load from the internet. Try CSV if offline.</div>';return}let wb=XLSX.read(new Uint8Array(r.result),{type:'array'});let ws=wb.Sheets[wb.SheetNames[0]];processRows(XLSX.utils.sheet_to_json(ws,{defval:''}))};r.readAsArrayBuffer(file)}}
function csvToRows(t){let lines=t.split(/\r?\n/).filter(x=>x.trim());let heads=lines.shift().split(',').map(h=>h.trim());return lines.map(l=>{let vals=l.split(',');let o={};heads.forEach((h,i)=>o[h]=vals[i]??'');return o})}
function processRows(rows){importRows=rows;let errs=[];mappedRows=rows.map((r,idx)=>{let get=(names)=>{let k=Object.keys(r).find(k=>names.some(n=>k.toLowerCase().includes(n)));return k?r[k]:''};let e={recordId:get(['record id','id'])||'IMP-'+uid(),entrySequence:+get(['entry sequence','sequence'])||nextSeq(),entryType:get(['entry type','type'])||'Fuel',dataQuality:get(['data quality','quality'])||'Review',date:get(['date'])||'',odometer:get(['odometer']),miles:get(['total miles','miles']),gallons:get(['gallons']),grade:get(['fuel grade','grade']),ethanolFree:normalizeEF(get(['ethanol free','ethanol'])),mpg:get(['mpg']),station:get(['station']),totalFuelCost:get(['cost']),fuelPricePerGallon:get(['price']),notes:get(['notes'])};if(!e.odometer)errs.push(`Row ${idx+1}: Missing odometer.`);return e});let duplicates=countDuplicates(mappedRows);$('impStatus').innerHTML=`<div class="${errs.length?'warning':'ok'}">${errs.length?errs.join('<br>'):'No blocking errors found.'}<br>Potential duplicates by Record ID: ${duplicates}</div>`;$('impPreview').innerHTML=`<div class="import-preview"><table class="table"><tr>${Object.keys(mappedRows[0]||{}).map(k=>`<th>${esc(k)}</th>`).join('')}</tr>${mappedRows.slice(0,20).map(r=>`<tr>${Object.values(r).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div><button class="primary" onclick="saveImport()">Save Import</button>`}
function normalizeEF(v){v=String(v||'').toLowerCase();if(v.includes('ef')||v.includes('free')||v.includes('non'))return'Yes';return'No'}

function saveImport(){let v=state.vehicles.find(Boolean);if(!v){alert('Add a vehicle before importing.');return}v.fuel=v.fuel||[];mappedRows.forEach(r=>{let existing=v.fuel.find(e=>e.recordId===r.recordId);let e={...r,id:existing?.id||uid(),date:r.date?new Date(r.date).toISOString():null,odometer:+r.odometer||'',miles:+r.miles||'',gallons:+r.gallons||'',mpg:+r.mpg||'',entryType:r.entryType||'Fuel'};if(existing)Object.assign(existing,e);else v.fuel.push(e)});recalcFuel(v);save();alert('Import saved to first configured vehicle. Move/reassign later if needed.');nav('vehicle',{i:state.vehicles.indexOf(v)})}

function groupAvg(arr,key,labelFn=x=>x||'Blank'){let g={};arr.forEach(e=>{let k=labelFn(e[key]);g[k]=g[k]||{s:0,c:0};if(e.mpg){g[k].s+=+e.mpg;g[k].c++}});return Object.fromEntries(Object.entries(g).map(([k,v])=>[k,v.c?v.s/v.c:0]))}
function tableSum(arr,key,field){let g={};arr.forEach(e=>{let k=e[key]||'Blank';g[k]=(g[k]||0)+(+e[field]||0)});return `<table class="table">${Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${num(v,2)}</td></tr>`).join('')}</table>`}
function drawBars(id,obj,title){let c=$(id);if(!c)return;let ctx=c.getContext('2d'),w=c.width=c.offsetWidth*2,h=c.height=170*2;ctx.clearRect(0,0,w,h);ctx.font='28px sans-serif';ctx.fillText(title,20,34);let ent=Object.entries(obj);if(!ent.length)return;let max=Math.max(...ent.map(e=>e[1]),1),bar=(w-50)/ent.length;ent.forEach(([k,v],i)=>{let x=25+i*bar,y=h-42-(v/max)*(h-90);ctx.fillRect(x,y,bar-12,h-42-y);ctx.font='20px sans-serif';ctx.fillText(k.slice(0,9),x,h-12);ctx.fillText(v.toFixed(1),x,y-6)})}
function sheet(html){$('sheet').innerHTML=html;$('modal').classList.add('show')}
function closeSheet(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()})
document.addEventListener('contextmenu',e=>{if(e.target.closest('.vehicle-card,.circle'))e.preventDefault()})
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');
render();
</script>
