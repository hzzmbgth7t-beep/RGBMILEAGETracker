<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RGB Mileage Tracker v1.0.1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RGB Mileage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe3ef;--blue:#2563eb;--red:#dc2626;--green:#059669;--shadow:0 8px 24px rgba(15,23,42,.08);--r:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:14px;background:#e8eefc;color:#153e90;padding:12px 14px;font-weight:700}button.primary{background:var(--blue);color:#fff}button.danger{background:#fee2e2;color:#991b1b}button.ghost{background:#eef2f7;color:#334155}.small{font-size:13px;padding:8px 10px}.wrap{max-width:520px;margin:0 auto;padding:18px 16px 36px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.title{font-size:28px;font-weight:900;letter-spacing:-.03em;text-align:center;margin:8px 0 18px}.sub{color:var(--muted);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stack{display:flex;flex-direction:column;gap:10px}.vehicle-card{text-align:center;padding:12px;background:transparent;border:0;box-shadow:none}.circle{width:min(58vw,270px);height:min(58vw,270px);border-radius:50%;margin:0 auto 10px;background:#eef2ff;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:#1e3a8a;overflow:hidden}.circle img{width:100%;height:100%;object-fit:cover}.vehicle-name{font-weight:800;font-size:19px;line-height:1.15}.home-actions{margin-top:18px;display:grid;gap:9px}.version{text-align:center;color:#94a3b8;margin-top:18px;font-size:12px}label{display:block;font-weight:800;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:88px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.pill{display:inline-block;background:#eef2ff;color:#1e3a8a;border-radius:999px;padding:5px 9px;font-weight:800;font-size:12px;margin:3px}.muted{color:var(--muted)}.hr{height:1px;background:var(--line);margin:14px 0}.list-item{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;margin:10px 0}.list-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;box-shadow:var(--shadow)}.kpi b{display:block;font-size:24px}.tabs{display:flex;gap:8px;overflow:auto;margin:8px 0}.tabs button{white-space:nowrap}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:end;justify-content:center;z-index:100}.modal.show{display:flex}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto}.sheet h2{margin-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview{width:110px;height:110px;border-radius:50%;background:#eef2ff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:auto;font-weight:900;font-size:28px}.preview img{width:100%;height:100%;object-fit:cover}canvas{width:100%;height:180px;background:#fff;border:1px solid var(--line);border-radius:14px}.note{font-size:12px;color:#64748b;margin-top:5px}.table{width:100%;border-collapse:collapse;font-size:14px}.table td,.table th{border-bottom:1px solid var(--line);padding:8px;text-align:left}.badge{background:#e0f2fe;color:#075985;border-radius:8px;padding:2px 6px;font-weight:800;font-size:12px}.locbox{background:#f8fafc;border:1px solid #dbe3ef;border-radius:12px;padding:10px;color:#334155}.footer-space{height:30px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const VERSION='1.0.1';
const KEY='rgbMileageTrackerData_v101';
const DEFAULT_STATIONS=['Murphy USA','Circle K','refuel','BP','Shell'];
const FUEL_GRADES=['87','89','90','91','93','Other'];
const FUEL_TYPES=['Contains Ethanol','Non-Ethanol'];
const MAINT_CATS=['Maintenance','Repair','Oil Change','Brakes','Tires','Cooling System','Electrical','Fuel System','Transmission','Engine','Suspension','Body','Other'];
let state=load(), route={screen:'home'}, currentEdit=null;
function defaultState(){return{version:VERSION,vehicles:[null,null],stations:[...DEFAULT_STATIONS],lastBackup:null}}
function load(){try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return defaultState()}}
function save(){state.version=VERSION;localStorage.setItem(KEY,JSON.stringify(state))}
function $(id){return document.getElementById(id)}
function money(n){return isFinite(+n)?'$'+(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):''}
function num(n,d=2){return isFinite(+n)?(+n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d}):''}
function dateOnly(s){if(!s)return'';return new Date(s).toLocaleDateString()}
function dateTime(s){if(!s)return'';return new Date(s).toLocaleString()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function vehicleName(v){return [v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle'}
function badgeFor(v){if(v.badge)return v.badge.toUpperCase();let parts=[v.make||'',v.model||''].join(' ').replace(/-/g,' ').split(/\s+/).filter(Boolean);let out='';for(let p of parts){if(/\d/.test(p))out+=p.replace(/[^a-zA-Z0-9]/g,'');else out+=p[0]||''}return (out||'+').toUpperCase().slice(0,6)}
function vehicleCircle(v){if(!v)return'<div class="circle">+</div><div class="vehicle-name">Add Vehicle</div>';if(v.photo)return`<div class="circle"><img src="${v.photo}"></div><div class="vehicle-name">${esc(v.year)} ${esc(v.make)}<br>${esc(v.model)}</div>`;return`<div class="circle">${esc(badgeFor(v))}</div><div class="vehicle-name">${esc(v.year)} ${esc(v.make)}<br>${esc(v.model)}</div>`}
function render(){const app=$('app'); if(route.screen==='home') return home(app); if(route.screen==='vehicle')return vehicleScreen(app,route.i); if(route.screen==='profile')return profileScreen(app,route.i); if(route.screen==='reports')return reportsScreen(app); if(route.screen==='stats')return statsScreen(app,route.i); if(route.screen==='maintenance')return maintenanceScreen(app,route.i); if(route.screen==='stations')return stationsScreen(app); if(route.screen==='backup')return backupScreen(app)}
function nav(screen,extra={}){route={screen,...extra};render();window.scrollTo(0,0)}
function backHome(){nav('home')}
function home(app){app.innerHTML=`<div class="title">RGB Mileage Tracker</div>
<div class="stack">
${[0,1].map(i=>`<div class="vehicle-card" onclick="tapVehicle(${i})" oncontextmenu="event.preventDefault();longVehicle(${i})" ontouchstart="lpStart(${i})" ontouchend="lpEnd()">${vehicleCircle(state.vehicles[i])}</div>`).join('')}
</div>
<div class="home-actions">
<button onclick="nav('reports')">Reports</button>
<button onclick="nav('maintenance')">Maintenance</button>
<button onclick="exportData()">Export Data</button>
<button onclick="$('importFile').click()">Import Data</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(this.files[0])">
<button onclick="nav('backup')">Backup / Restore</button>
<button onclick="nav('stations')" class="ghost">Manage Stations</button>
</div><div class="version">Version ${VERSION}</div>`}
function tapVehicle(i){state.vehicles[i]?nav('vehicle',{i}):nav('profile',{i})}
let lpTimer=null;function lpStart(i){lpTimer=setTimeout(()=>longVehicle(i),650)}function lpEnd(){clearTimeout(lpTimer)}
function longVehicle(i){let v=state.vehicles[i]; if(!v)return; sheet(`<h2>${esc(vehicleName(v))}</h2>
<div class="stack">
<button onclick="closeSheet();nav('vehicle',{i:${i}})">Open Vehicle</button>
<button onclick="closeSheet();nav('stats',{i:${i}})">View Statistics</button>
<button onclick="closeSheet();nav('profile',{i:${i}})">Edit Vehicle</button>
<button onclick="closeSheet();changeVehiclePhoto(${i})">Change Photo</button>
<button class="danger" onclick="closeSheet();deleteVehicle(${i})">Delete Vehicle</button>
<button class="ghost" onclick="closeSheet()">Cancel</button></div>`)}
function deleteVehicle(i){if(confirm('Delete Vehicle? This will delete vehicle information, fuel records, maintenance records, and insurance records.')){state.vehicles[i]=null;save();render()}}
function fileToDataURL(file,cb){let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function profileScreen(app,i){let v=state.vehicles[i]||{id:uid(),fuel:[],maintenance:[],insurance:{attachments:[]},lastFuel:{}};app.innerHTML=`<div class="top"><button onclick="backHome()" class="small">Back</button><b>${state.vehicles[i]?'Edit Vehicle':'Add Vehicle'}</b><span></span></div>
<div class="card">
<div class="preview" id="photoPrev">${v.photo?`<img src="${v.photo}">`:(v.badge||badgeFor(v))}</div>
<div class="actions"><button onclick="$('photoIn').click()">Choose Photo</button><button onclick="removeProfilePhoto()">Remove Photo</button><input id="photoIn" class="hidden" type="file" accept="image/*" onchange="loadProfilePhoto(this.files[0])"></div>
<label>Year</label><input id="year" value="${esc(v.year||'')}">
<label>Make</label><input id="make" value="${esc(v.make||'')}">
<label>Model</label><input id="model" value="${esc(v.model||'')}">
<label>Display Badge (Optional)</label><input id="badge" value="${esc(v.badge||'')}">
<div class="row"><div><label>Purchase Date</label><input id="purchaseDate" type="date" value="${esc(v.purchaseDate||'')}"></div><div><label>Purchase Cost</label><input id="purchaseCost" type="number" step="0.01" value="${esc(v.purchaseCost||'')}"></div></div>
</div>
<div class="card"><h3>Insurance Information</h3>
<label>Insurance Company</label><input id="insCompany" value="${esc(v.insurance?.company||'')}">
<label>Policy Number</label><input id="insPolicy" value="${esc(v.insurance?.policy||'')}">
<div class="row"><div><label>Effective Date</label><input id="insEff" type="date" value="${esc(v.insurance?.effective||'')}"></div><div><label>Expiration Date</label><input id="insExp" type="date" value="${esc(v.insurance?.expiration||'')}"></div></div>
<label>Insurance Value</label><input id="insValue" type="number" step="0.01" value="${esc(v.insurance?.value||'')}">
<label>Attachments</label><input id="insAttach" type="file" multiple accept=".pdf,image/*" onchange="addAttachments(this.files,'insurance',${i})">
<div id="insList">${(v.insurance?.attachments||[]).map((a,idx)=>`<div class="list-item"><b>${esc(a.name)}</b><div class="actions"><button class="small" onclick="viewAttachment(${i},'insurance',${idx})">View</button><button class="small danger" onclick="delAttachment(${i},'insurance',${idx})">Delete</button></div></div>`).join('')}</div>
</div>
<button class="primary" onclick="saveProfile(${i})">Save Vehicle</button>`
window._profilePhoto=v.photo||''}
function loadProfilePhoto(file){if(!file)return;fileToDataURL(file,d=>{window._profilePhoto=d;$('photoPrev').innerHTML='<img src="'+d+'">'})}
function removeProfilePhoto(){window._profilePhoto='';$('photoPrev').textContent='+'}
function saveProfile(i){let old=state.vehicles[i]||{id:uid(),fuel:[],maintenance:[],insurance:{attachments:[]},lastFuel:{}};old.year=$('year').value.trim();old.make=$('make').value.trim();old.model=$('model').value.trim();old.badge=$('badge').value.trim();old.photo=window._profilePhoto||'';old.purchaseDate=$('purchaseDate').value;old.purchaseCost=$('purchaseCost').value;old.insurance=old.insurance||{attachments:[]};Object.assign(old.insurance,{company:$('insCompany').value.trim(),policy:$('insPolicy').value.trim(),effective:$('insEff').value,expiration:$('insExp').value,value:$('insValue').value});state.vehicles[i]=old;save();nav('vehicle',{i})}
function changeVehiclePhoto(i){nav('profile',{i})}
function vehicleScreen(app,i){let v=state.vehicles[i];if(!v)return backHome();recalcFuel(v);let lf=v.lastFuel||{};app.innerHTML=`<div class="top"><button onclick="backHome()" class="small">Back</button><b>${esc(vehicleName(v))}</b><button onclick="nav('stats',{i:${i}})" class="small">Stats</button></div>
<div class="card"><h3>New Fuel Entry</h3>
<div class="sub">Date / Time: ${new Date().toLocaleString()}</div>
<label>Odometer</label><input id="odo" type="number" inputmode="decimal" oninput="calcEntry(${i})">
<label>Miles</label><input id="miles" type="number" inputmode="decimal" oninput="calcEntry(${i})">
<label>Gallons Purchased</label><input id="gallons" type="number" step="0.001" inputmode="decimal" oninput="calcEntry(${i})">
<div class="row"><div><label>Fuel Grade</label><select id="grade">${FUEL_GRADES.map(g=>`<option ${lf.grade===g?'selected':''}>${g}</option>`).join('')}</select></div><div><label>Fuel Type</label><select id="ftype">${FUEL_TYPES.map(t=>`<option ${lf.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
<label>Station</label><select id="station" onchange="if(this.value==='Other')otherStation()">${state.stations.map(s=>`<option ${lf.station===s?'selected':''}>${esc(s)}</option>`).join('')}<option>Other</option></select>
<label>Location</label><div class="locbox" id="locText">No location selected.</div>
<input id="locAddress" type="hidden"><input id="locLat" type="hidden"><input id="locLon" type="hidden">
<div class="actions"><button onclick="useLocation(${i})">Use Current Location</button><button class="ghost" onclick="clearLocation()">Clear Location</button></div>
<div class="note">Location is only captured when this button is tapped.</div>
<label>MPG</label><input id="mpg" readonly>
<label>Notes</label><textarea id="notes"></textarea>
<button class="primary" onclick="saveFuel(${i})">Save Entry</button></div>
<div class="card"><h3>Fuel History</h3><button class="ghost" onclick="$('hist').classList.toggle('hidden')">Show / Hide History</button><div id="hist" class="hidden">${fuelHistory(v,i)}</div></div>`;calcEntry(i)}
function previousOdo(v){let f=(v.fuel||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));return f.length?+f[f.length-1].odometer:null}
function calcEntry(i){let v=state.vehicles[i], odo=+$('odo').value, prev=previousOdo(v);if(prev!==null && isFinite(odo) && odo>0){$('miles').value=(odo-prev).toFixed(1).replace(/\.0$/,'')}let miles=+$('miles').value, gal=+$('gallons').value;$('mpg').value=(miles>0&&gal>0)?(miles/gal).toFixed(2):''}
function otherStation(){sheet(`<h2>New Station</h2><label>Station Name</label><input id="newStation"><p>Add this station to future dropdown list?</p><div class="actions"><button class="primary" onclick="setOtherStation(true)">Yes</button><button onclick="setOtherStation(false)">No</button><button class="ghost" onclick="closeSheet()">Cancel</button></div>`)}
function setOtherStation(add){let n=$('newStation').value.trim();if(!n)return;if(add && !state.stations.includes(n)){state.stations.push(n);save()}let sel=$('station');if(![...sel.options].some(o=>o.value===n)){let opt=document.createElement('option');opt.textContent=n;sel.insertBefore(opt,sel.lastElementChild)}sel.value=n;closeSheet()}
function clearLocation(){$('locAddress').value='';$('locLat').value='';$('locLon').value='';$('locText').textContent='No location selected.'}
async function useLocation(i){if(!navigator.geolocation){alert('Location is not supported by this browser.');return}sheet('<h2>Finding Location...</h2><p>Please approve location access if prompted.</p>');navigator.geolocation.getCurrentPosition(async pos=>{let lat=pos.coords.latitude, lon=pos.coords.longitude;let display=`${lat.toFixed(5)}, ${lon.toFixed(5)}`, station='';try{let url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&extratags=1`;let r=await fetch(url,{headers:{'Accept':'application/json'}});let data=await r.json();display=data.display_name||display;station=(data.name||'').trim();let cls=(data.category||data.type||'').toLowerCase();if(!station && data.address){station=data.address.fuel||data.address.shop||''}if(cls && !(cls.includes('fuel')||cls.includes('gas')||cls.includes('amenity'))){} }catch(e){}
if(station){sheet(`<h2>Use This Station?</h2><p><b>${esc(station)}</b></p><p class="muted">${esc(display)}</p><div class="actions"><button class="primary" onclick="acceptDetectedStation('${encodeURIComponent(station)}','${encodeURIComponent(display)}',${lat},${lon})">Yes</button><button onclick="acceptLocationOnly('${encodeURIComponent(display)}',${lat},${lon})">Location Only</button><button class="ghost" onclick="closeSheet()">Cancel</button></div>`)}else{sheet(`<h2>Use This Location?</h2><p class="muted">${esc(display)}</p><div class="actions"><button class="primary" onclick="acceptLocationOnly('${encodeURIComponent(display)}',${lat},${lon})">Yes</button><button class="ghost" onclick="closeSheet()">Cancel</button></div>`) }},err=>{sheet(`<h2>Location Error</h2><p>${esc(err.message)}</p><button onclick="closeSheet()">Close</button>`)},{enableHighAccuracy:true,timeout:12000})}
function acceptLocationOnly(addr,lat,lon){addr=decodeURIComponent(addr);$('locAddress').value=addr;$('locLat').value=lat;$('locLon').value=lon;$('locText').textContent=addr;closeSheet()}
function acceptDetectedStation(st,addr,lat,lon){st=decodeURIComponent(st);addr=decodeURIComponent(addr);$('locAddress').value=addr;$('locLat').value=lat;$('locLon').value=lon;$('locText').textContent=addr;let sel=$('station');if(![...sel.options].some(o=>o.value===st)){let opt=document.createElement('option');opt.textContent=st;sel.insertBefore(opt,sel.lastElementChild)}sel.value=st;sheet(`<h2>Add To Station Drop Down List?</h2><p><b>${esc(st)}</b></p><div class="actions"><button class="primary" onclick="addDetectedStation('${encodeURIComponent(st)}')">Yes</button><button onclick="closeSheet()">No</button></div>`)}
function addDetectedStation(st){st=decodeURIComponent(st);if(!state.stations.includes(st)){state.stations.push(st);save()}closeSheet()}
function saveFuel(i){let v=state.vehicles[i];let e={id:uid(),date:new Date().toISOString(),odometer:+$('odo').value,miles:+$('miles').value,gallons:+$('gallons').value,grade:$('grade').value,type:$('ftype').value,station:$('station').value,location:$('locAddress').value,lat:$('locLat').value,lon:$('locLon').value,mpg:+$('mpg').value,notes:$('notes').value.trim()};if(!e.odometer||!e.gallons){alert('Odometer and gallons are required.');return}v.fuel=v.fuel||[];v.fuel.push(e);v.lastFuel={grade:e.grade,type:e.type,station:e.station};recalcFuel(v);save();render()}
function recalcFuel(v){let arr=(v.fuel||[]).sort((a,b)=>new Date(a.date)-new Date(b.date));for(let j=0;j<arr.length;j++){if(j>0){arr[j].miles=(+arr[j].odometer)-(+arr[j-1].odometer)}if(arr[j].miles&&arr[j].gallons)arr[j].mpg=+(arr[j].miles/arr[j].gallons).toFixed(2)}}
function fuelHistory(v,i){let arr=(v.fuel||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));return arr.map(e=>`<div class="list-item"><div class="list-head"><b>${dateTime(e.date)}</b><span class="badge">${num(e.mpg)} MPG</span></div><p>Odometer: ${esc(e.odometer)}<br>Miles: ${num(e.miles,1)}<br>Gallons: ${num(e.gallons,3)}<br>Fuel: ${esc(e.grade)} / ${esc(e.type)}<br>Station: ${esc(e.station||'')}<br>Location: ${esc(e.location||'')}<br>Notes: ${esc(e.notes||'')}</p><div class="actions"><button class="small" onclick="editFuel(${i},'${e.id}')">Edit</button><button class="small danger" onclick="deleteFuel(${i},'${e.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No fuel entries yet.</p>'}
function editFuel(i,id){let v=state.vehicles[i],e=v.fuel.find(x=>x.id===id);sheet(`<h2>Edit Fuel Entry</h2><p class="muted">Date/time cannot be changed: ${dateTime(e.date)}</p><label>Odometer</label><input id="efO" type="number" value="${e.odometer}"><label>Miles</label><input id="efM" type="number" value="${e.miles||''}"><label>Gallons</label><input id="efG" type="number" step="0.001" value="${e.gallons||''}"><label>Fuel Grade</label><select id="efGrade">${FUEL_GRADES.map(g=>`<option ${e.grade===g?'selected':''}>${g}</option>`).join('')}</select><label>Fuel Type</label><select id="efType">${FUEL_TYPES.map(t=>`<option ${e.type===t?'selected':''}>${t}</option>`).join('')}</select><label>Station</label><input id="efStation" value="${esc(e.station||'')}"><label>Location</label><input id="efLoc" value="${esc(e.location||'')}"><label>Notes</label><textarea id="efNotes">${esc(e.notes||'')}</textarea><div class="actions"><button class="primary" onclick="saveFuelEdit(${i},'${id}')">Save Changes</button><button onclick="closeSheet()">Cancel</button></div>`)}
function saveFuelEdit(i,id){let e=state.vehicles[i].fuel.find(x=>x.id===id);Object.assign(e,{odometer:+$('efO').value,miles:+$('efM').value,gallons:+$('efG').value,grade:$('efGrade').value,type:$('efType').value,station:$('efStation').value,location:$('efLoc').value,notes:$('efNotes').value});recalcFuel(state.vehicles[i]);save();closeSheet();render()}
function deleteFuel(i,id){if(confirm('Delete Fuel Entry? Future calculations will be recalculated.')){let v=state.vehicles[i];v.fuel=v.fuel.filter(e=>e.id!==id);recalcFuel(v);save();render()}}
function stationsScreen(app){app.innerHTML=`<div class="top"><button onclick="backHome()" class="small">Back</button><b>Manage Stations</b><span></span></div><div class="card">${state.stations.map((s,idx)=>`<div class="list-item"><b>${esc(s)}</b><div class="actions"><button class="small" onclick="editStation(${idx})">Edit</button><button class="small danger" onclick="deleteStation(${idx})">Delete</button></div></div>`).join('')}<button class="primary" onclick="addStation()">Add Station</button></div>`}
function addStation(){sheet(`<h2>Add Station</h2><input id="stName"><button class="primary" onclick="let n=$('stName').value.trim();if(n&&!state.stations.includes(n)){state.stations.push(n);save();closeSheet();render()}">Save</button>`)}
function editStation(idx){let old=state.stations[idx];sheet(`<h2>Edit Station?</h2><p>This will update all historical entries using this station name.</p><input id="stName" value="${esc(old)}"><div class="actions"><button class="primary" onclick="saveStationEdit(${idx})">Save Changes</button><button onclick="closeSheet()">Cancel</button></div>`)}
function saveStationEdit(idx){let old=state.stations[idx], n=$('stName').value.trim();if(!n)return;state.stations[idx]=n;state.vehicles.forEach(v=>v&&(v.fuel||[]).forEach(e=>{if(e.station===old)e.station=n}));save();closeSheet();render()}
function deleteStation(idx){if(confirm('Delete Station? Historical entries will remain unchanged.')){state.stations.splice(idx,1);save();render()}}
function maintenanceScreen(app,i=null){let vehicles=state.vehicles.filter(Boolean);let selected=i??(vehicles[0]?state.vehicles.indexOf(vehicles[0]):-1);let v=state.vehicles[selected];app.innerHTML=`<div class="top"><button onclick="backHome()" class="small">Back</button><b>Maintenance</b><span></span></div>${vehicles.length?`<label>Vehicle</label><select onchange="nav('maintenance',{i:+this.value})">${state.vehicles.map((vv,idx)=>vv?`<option value="${idx}" ${idx===selected?'selected':''}>${esc(vehicleName(vv))}</option>`:'').join('')}</select>`:'<p>Add a vehicle first.</p>'}${v?maintForm(v,selected):''}`}
function maintForm(v,i){return `<div class="card"><h3>New Maintenance Record</h3><div class="row"><div><label>Drop Off Date</label><input id="mDrop" type="date"></div><div><label>Pick Up Date</label><input id="mPick" type="date"></div></div><label>Location</label><input id="mLoc"><label>Category</label><select id="mCat">${MAINT_CATS.map(c=>`<option>${c}</option>`).join('')}</select><label>Odometer</label><input id="mOdo" type="number"><label>Cost</label><input id="mCost" type="number" step="0.01"><label>Notes</label><textarea id="mNotes"></textarea><label>Photos / Receipts</label><input id="mAttach" type="file" multiple accept=".pdf,image/*"><button class="primary" onclick="saveMaint(${i})">Save Record</button></div><div class="card"><h3>Maintenance History</h3>${(v.maintenance||[]).slice().sort((a,b)=>(b.drop||'').localeCompare(a.drop||'')).map(r=>`<div class="list-item"><b>${esc(r.category)}</b> <span class="muted">${esc(r.drop||'')} - ${esc(r.pick||'')}</span><p>Location: ${esc(r.location||'')}<br>Odometer: ${esc(r.odometer||'')}<br>Cost: ${money(r.cost)}<br>Notes: ${esc(r.notes||'')}</p><div class="actions"><button class="small" onclick="editMaint(${i},'${r.id}')">Edit</button><button class="small danger" onclick="deleteMaint(${i},'${r.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No maintenance records yet.</p>'}</div>`}
function saveMaint(i){let v=state.vehicles[i], files=$('mAttach').files;let rec={id:uid(),drop:$('mDrop').value,pick:$('mPick').value,location:$('mLoc').value.trim(),category:$('mCat').value,odometer:$('mOdo').value,cost:+$('mCost').value||0,notes:$('mNotes').value.trim(),attachments:[]};let add=()=>{v.maintenance=v.maintenance||[];v.maintenance.push(rec);save();render()};if(files.length){let left=files.length;[...files].forEach(f=>fileToDataURL(f,d=>{rec.attachments.push({name:f.name,type:f.type,data:d});if(--left===0)add()}))}else add()}
function editMaint(i,id){let r=state.vehicles[i].maintenance.find(x=>x.id===id);sheet(`<h2>Edit Maintenance</h2><label>Drop Off</label><input id="emDrop" type="date" value="${r.drop||''}"><label>Pick Up</label><input id="emPick" type="date" value="${r.pick||''}"><label>Location</label><input id="emLoc" value="${esc(r.location||'')}"><label>Category</label><select id="emCat">${MAINT_CATS.map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select><label>Odometer</label><input id="emOdo" value="${esc(r.odometer||'')}"><label>Cost</label><input id="emCost" type="number" step="0.01" value="${r.cost||''}"><label>Notes</label><textarea id="emNotes">${esc(r.notes||'')}</textarea><div class="actions"><button class="primary" onclick="saveMaintEdit(${i},'${id}')">Save Changes</button><button onclick="closeSheet()">Cancel</button></div>`)}
function saveMaintEdit(i,id){let r=state.vehicles[i].maintenance.find(x=>x.id===id);Object.assign(r,{drop:$('emDrop').value,pick:$('emPick').value,location:$('emLoc').value,category:$('emCat').value,odometer:$('emOdo').value,cost:+$('emCost').value||0,notes:$('emNotes').value});save();closeSheet();render()}
function deleteMaint(i,id){if(confirm('Delete Maintenance Record?')){let v=state.vehicles[i];v.maintenance=v.maintenance.filter(r=>r.id!==id);save();render()}}
function statsForFuel(f){let totalMiles=f.reduce((s,e)=>s+(+e.miles||0),0), totalGal=f.reduce((s,e)=>s+(+e.gallons||0),0), mpgs=f.map(e=>+e.mpg).filter(Boolean);return{miles:totalMiles,gal:totalGal,mpg:totalGal?totalMiles/totalGal:0,count:f.length,best:mpgs.length?Math.max(...mpgs):0,worst:mpgs.length?Math.min(...mpgs):0}}
function statsScreen(app,i){let v=state.vehicles[i];let f=v.fuel||[], s=statsForFuel(f), maint=(v.maintenance||[]), maintCost=maint.reduce((a,r)=>a+(+r.cost||0),0);let days=v.purchaseDate?Math.floor((Date.now()-new Date(v.purchaseDate))/(86400000)):0;let stationFreq=mode(f.map(e=>e.station).filter(Boolean));let locFreq=mode(f.map(e=>e.location).filter(Boolean));app.innerHTML=`<div class="top"><button onclick="nav('vehicle',{i:${i}})" class="small">Back</button><b>Vehicle Statistics</b><span></span></div>
<div class="card"><h3>${esc(vehicleName(v))}</h3><p>Purchase Date: ${esc(v.purchaseDate||'')}<br>Days Owned: ${days||''}<br>Years Owned: ${days?(days/365.25).toFixed(2):''}<br>Purchase Cost: ${money(v.purchaseCost)}<br>Insurance Company: ${esc(v.insurance?.company||'')}<br>Policy Number: ${esc(v.insurance?.policy||'')}<br>Effective: ${esc(v.insurance?.effective||'')}<br>Expiration: ${esc(v.insurance?.expiration||'')}<br>Insurance Value: ${money(v.insurance?.value)}</p></div>
<div class="grid"><div class="kpi"><span>Total Miles</span><b>${num(s.miles,1)}</b></div><div class="kpi"><span>Total Gallons</span><b>${num(s.gal,2)}</b></div><div class="kpi"><span>Lifetime MPG</span><b>${num(s.mpg)}</b></div><div class="kpi"><span>Entries</span><b>${s.count}</b></div><div class="kpi"><span>Best MPG</span><b>${num(s.best)}</b></div><div class="kpi"><span>Worst MPG</span><b>${num(s.worst)}</b></div></div>
<div class="card"><h3>Ownership Statistics</h3><p>Total Maintenance Cost: ${money(maintCost)}<br>Total Invested: ${money((+v.purchaseCost||0)+maintCost)}<br>Maintenance Cost Per Mile: ${s.miles?money(maintCost/s.miles):''}<br>Most Frequent Station: ${esc(stationFreq||'')}<br>Most Frequent Location: ${esc(locFreq||'')}</p></div>
<div class="card"><h3>Charts</h3><canvas id="chart1"></canvas><div class="hr"></div><canvas id="chart2"></canvas></div>`;setTimeout(()=>{drawLine('chart1',f.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).map(e=>+e.mpg||0),'MPG Over Time');drawBars('chart2',groupAvg(f,'type'),'MPG by Fuel Type')},50)}
function reportsScreen(app){let allF=[];state.vehicles.forEach(v=>v&&(v.fuel||[]).forEach(e=>allF.push({...e,vehicle:vehicleName(v)})));let s=statsForFuel(allF);app.innerHTML=`<div class="top"><button onclick="backHome()" class="small">Back</button><b>Reports</b><span></span></div><div class="card"><label>Vehicle</label><select id="repVeh" onchange="renderReport()"><option value="all">All Vehicles</option>${state.vehicles.map((v,i)=>v?`<option value="${i}">${esc(vehicleName(v))}</option>`:'').join('')}</select><label>Time Frame</label><select id="repRange" onchange="renderReport()"><option>All Time</option><option>YTD</option><option>Previous Week</option><option>Previous Month</option><option>Previous Year</option><option>Manual Range</option></select><div id="manualRange" class="row hidden"><div><label>Start Date</label><input id="startDate" type="date" onchange="renderReport()"></div><div><label>End Date</label><input id="endDate" type="date" onchange="renderReport()"></div></div></div><div id="reportOut"></div>`;renderReport()}
function getReportFuel(){let val=$('repVeh').value, arr=[];state.vehicles.forEach((v,i)=>{if(v&&(val==='all'||+val===i))(v.fuel||[]).forEach(e=>arr.push({...e,vehicle:vehicleName(v)}))});let range=$('repRange').value; $('manualRange').classList.toggle('hidden',range!=='Manual Range');let now=new Date(), start=null,end=null;if(range==='YTD')start=new Date(now.getFullYear(),0,1); if(range==='Previous Week'){let d=new Date(now);d.setDate(d.getDate()-7);start=d} if(range==='Previous Month'){start=new Date(now.getFullYear(),now.getMonth()-1,1);end=new Date(now.getFullYear(),now.getMonth(),1)} if(range==='Previous Year'){start=new Date(now.getFullYear()-1,0,1);end=new Date(now.getFullYear(),0,1)} if(range==='Manual Range'){start=$('startDate').value?new Date($('startDate').value):null;end=$('endDate').value?new Date($('endDate').value+'T23:59:59'):null}return arr.filter(e=>(!start||new Date(e.date)>=start)&&(!end||new Date(e.date)<=end))}
function renderReport(){let f=getReportFuel(),s=statsForFuel(f);$('reportOut').innerHTML=`<div class="grid"><div class="kpi"><span>Total Miles</span><b>${num(s.miles,1)}</b></div><div class="kpi"><span>Gallons</span><b>${num(s.gal,2)}</b></div><div class="kpi"><span>Average MPG</span><b>${num(s.mpg)}</b></div><div class="kpi"><span>Fill-Ups</span><b>${s.count}</b></div><div class="kpi"><span>Best MPG</span><b>${num(s.best)}</b></div><div class="kpi"><span>Worst MPG</span><b>${num(s.worst)}</b></div></div><div class="card"><h3>Fuel Comparisons</h3><canvas id="r1"></canvas><div class="hr"></div><canvas id="r2"></canvas><div class="hr"></div><h4>Gallons by Station</h4>${tableSum(f,'station','gallons')}</div>`;setTimeout(()=>{drawBars('r1',groupAvg(f,'type'),'MPG by Fuel Type');drawBars('r2',groupAvg(f,'grade'),'MPG by Fuel Grade')},50)}
function groupAvg(arr,key){let g={};arr.forEach(e=>{let k=e[key]||'Unknown';g[k]=g[k]||{sum:0,c:0};if(e.mpg){g[k].sum+=+e.mpg;g[k].c++}});return Object.fromEntries(Object.entries(g).map(([k,v])=>[k,v.c?v.sum/v.c:0]))}
function tableSum(arr,key,field){let g={};arr.forEach(e=>{let k=e[key]||'Unknown';g[k]=(g[k]||0)+(+e[field]||0)});return `<table class="table">${Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${num(v,2)}</td></tr>`).join('')}</table>`}
function mode(arr){let c={},best='',n=0;arr.forEach(x=>{c[x]=(c[x]||0)+1;if(c[x]>n){n=c[x];best=x}});return best}
function drawLine(id,data,title){let c=$(id),ctx=c.getContext('2d'),w=c.width=c.offsetWidth*2,h=c.height=180*2;ctx.clearRect(0,0,w,h);ctx.font='28px sans-serif';ctx.fillText(title,20,35);if(!data.length)return;let max=Math.max(...data,1),min=Math.min(...data,0),pad=50;ctx.beginPath();data.forEach((v,i)=>{let x=pad+i*(w-2*pad)/Math.max(1,data.length-1), y=h-pad-(v-min)/(max-min||1)*(h-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.lineWidth=5;ctx.stroke()}
function drawBars(id,obj,title){let c=$(id),ctx=c.getContext('2d'),w=c.width=c.offsetWidth*2,h=c.height=180*2;ctx.clearRect(0,0,w,h);ctx.font='28px sans-serif';ctx.fillText(title,20,35);let ent=Object.entries(obj);if(!ent.length)return;let max=Math.max(...ent.map(e=>e[1]),1),bar=(w-60)/ent.length;ent.forEach(([k,v],i)=>{let x=30+i*bar,y=h-40-(v/max)*(h-90);ctx.fillRect(x,y,bar-12,h-40-y);ctx.font='20px sans-serif';ctx.fillText(k.slice(0,10),x,h-12);ctx.fillText(v.toFixed(1),x,y-6)})}
function backupScreen(app){app.innerHTML=`<div class="top"><button onclick="backHome()" class="small">Back</button><b>Backup / Restore</b><span></span></div><div class="card"><p>Last Backup Date: ${state.lastBackup?dateTime(state.lastBackup):'Never'}</p><button class="primary" onclick="exportData(true)">Create Backup</button><button onclick="$('restoreFile').click()">Restore Backup</button><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="importData(this.files[0])"></div>`}
function exportData(isBackup=false){if(isBackup){state.lastBackup=new Date().toISOString();save()}let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`RGB_Mileage_Tracker_v${VERSION}_${isBackup?'backup':'export'}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(confirm('Import data? This will replace current app data.')){state=Object.assign(defaultState(),d);save();render()}}catch(e){alert('Invalid import file.')}};r.readAsText(file)}
function addAttachments(files,type,i){let v=state.vehicles[i];let target=type==='insurance'?v.insurance.attachments:[];let left=files.length;if(!left)return;[...files].forEach(f=>fileToDataURL(f,d=>{target.push({name:f.name,type:f.type,data:d});if(--left===0){save();render()}}))}
function viewAttachment(i,type,idx){let a=state.vehicles[i].insurance.attachments[idx];let win=window.open();win.document.write(`<iframe src="${a.data}" style="border:0;width:100%;height:100vh"></iframe>`)}
function delAttachment(i,type,idx){if(confirm('Delete attachment?')){state.vehicles[i].insurance.attachments.splice(idx,1);save();render()}}
function sheet(html){$('sheet').innerHTML=html;$('modal').classList.add('show')}
function closeSheet(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()})
if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
render();
</script>
</body>
</html>
